<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="#!">Start Bootstrap</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#!">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#!">About</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Shop</a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#!">All Products</a></li>
                            <li><hr class="dropdown-divider" /></li>
                            <li><a class="dropdown-item" href="#!">Popular Items</a></li>
                            <li><a class="dropdown-item" href="#!">New Arrivals</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex">
                    <button class="btn btn-outline-dark" type="submit">
                        <i class="bi-cart-fill me-1"></i>
                        Cart
                        <span class="badge bg-dark text-white ms-1 rounded-pill">0</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Header-->
    <header class="bg-dark py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div class="text-center text-white">
                <h1 class="display-4 fw-bolder">Cook in style</h1>
                <p class="lead fw-normal text-white-50 mb-0">With this recipe homepage template</p>
            </div>
        </div>
    </header>

    <!-- Section-->
    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
            <div id="output" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center"></div>
        </div>
    </section>

    <!-- Footer-->
    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
    </footer>

    <script>
        const fetchRecipes = async () => {
            const display = document.getElementById('output')
            try {
                const res = await fetch('https://dummyjson.com/recipes')
                const data = await res.json()
                const recipes = data.recipes   // the API returns { recipes: [...] }

                display.innerHTML = recipes.map(rec => `
                    <div class="col mb-5">
                        <div class="card h-100">
                            <!-- Recipe image-->
                            <img class="card-img-top" src="${rec.image}" alt="${rec.name}" />
                            <!-- Recipe details-->
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <!-- Recipe name-->
                                    <h5 class="fw-bolder">${rec.name}</h5>
                                    <!-- Cuisine, difficulty, rating-->
                                    <p class="text-muted mb-1">${rec.cuisine} &middot; ${rec.difficulty}</p>
                                    <p class="mb-0"><i class="bi-star-fill text-warning"></i> ${rec.rating}
                                    &nbsp;|&nbsp; ${rec.caloriesPerServing} kcal</p>
                                </div>
                            </div>
                            <!-- Recipe actions-->
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <div class="text-center"><a class="btn btn-outline-dark mt-auto" href="recipe.html?id=${rec.id}">View recipe</a></div>
                            </div>
                        </div>
                    </div>`).join('')
            } catch (err) {
                console.log(err)
                display.innerHTML = '<p class="text-center text-danger">Could not load recipes. Please try again.</p>'
            }
        }
        fetchRecipes()
    </script>
</body>
</html>
