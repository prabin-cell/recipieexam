<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="index.html">Start Bootstrap</a>
            <a class="btn btn-outline-dark" href="index.html"><i class="bi-arrow-left me-1"></i>Back to recipes</a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container px-4 px-lg-5 my-5">
            <div id="output" class="row gx-4 gx-lg-5 align-items-start"></div>
        </div>
    </section>

    <!-- Footer-->
    <footer class="py-5 bg-dark">
        <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2023</p></div>
    </footer>

    <script>
        const showRecipe = async () => {
            const display = document.getElementById('output')
            const id = new URLSearchParams(window.location.search).get('id')

            if (!id) {
                display.innerHTML = '<p class="text-center text-danger">No recipe selected.</p>'
                return
            }

            try {
                const res = await fetch(`https://dummyjson.com/recipes/${id}`)
                if (!res.ok) throw new Error('Recipe not found')
                const rec = await res.json()
                document.title = rec.name

                display.innerHTML = `
                    <div class="col-md-6 mb-4">
                        <img class="card-img-top mb-3 mb-md-0 rounded" src="${rec.image}" alt="${rec.name}" />
                    </div>
                    <div class="col-md-6">
                        <div class="small mb-1 text-muted">${rec.cuisine} &middot; ${rec.difficulty}</div>
                        <h1 class="display-5 fw-bolder">${rec.name}</h1>
                        <p class="mb-3">
                            <i class="bi-star-fill text-warning"></i> ${rec.rating}
                            &nbsp;|&nbsp; ${rec.prepTimeMinutes} min prep
                            &nbsp;|&nbsp; ${rec.cookTimeMinutes} min cook
                            &nbsp;|&nbsp; ${rec.servings} servings
                        </p>

                        <h4 class="fw-bolder">Ingredients</h4>
                        <ul class="list-group mb-4">
                            ${rec.ingredients.map(item => `
                                <li class="list-group-item"><i class="bi-check2 me-2"></i>${item}</li>`).join('')}
                        </ul>

                        <h4 class="fw-bolder">Instructions</h4>
                        <ol>
                            ${rec.instructions.map(step => `<li class="mb-2">${step}</li>`).join('')}
                        </ol>
                    </div>`
            } catch (err) {
                console.log(err)
                display.innerHTML = '<p class="text-center text-danger">Could not load this recipe. Please try again.</p>'
            }
        }
        showRecipe()
    </script>
</body>
</html>
